<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="board-wrap">
      <div class="board-label top" id="top-files"></div>
      <div class="board-row">
        <div class="board-label side" id="left-ranks"></div>
        <div class="board" id="board" aria-label="Chess board"></div>
        <div class="board-label side" id="right-ranks"></div>
      </div>
      <div class="board-label bottom" id="bottom-files"></div>
    </section>

    <aside class="panel">
      <h1 class="title">Chess</h1>
      <p class="status" id="status">White to move</p>
      <p class="substatus" id="sync-status">Local mode</p>

      <div class="card mode-gate" id="mode-gate">
        <h2 class="moves-title">Choose Mode</h2>
        <p class="room-meta" id="mode-prompt">Sign in first to continue.</p>
        <div class="buttons">
          <button id="single-mode-btn" class="btn btn-primary" type="button">Single Player</button>
          <button id="multi-mode-btn" class="btn btn-muted" type="button">Multiplayer</button>
        </div>
      </div>

      <div class="card" id="account-card">
        <h2 class="moves-title">Account</h2>
        <p class="account-name" id="account-name">Not signed in</p>
      </div>

      <div class="card" id="single-card">
        <h2 class="moves-title">Single Player</h2>
        <div class="buttons">
          <button id="difficulty-easy-btn" class="btn btn-muted" type="button">Easy</button>
          <button id="difficulty-medium-btn" class="btn btn-primary" type="button">Medium</button>
          <button id="difficulty-hard-btn" class="btn btn-muted" type="button">Hard</button>
        </div>
        <div class="buttons">
          <button id="sound-toggle-btn" class="btn btn-muted" type="button">Sound: On</button>
        </div>
      </div>

      <div class="card" id="multiplayer-card">
        <h2 class="moves-title">Multiplayer</h2>
        <div class="buttons">
          <button id="create-room-btn" class="btn btn-primary" type="button">Create Room</button>
          <button id="leave-room-btn" class="btn btn-muted" type="button">Leave Room</button>
        </div>
        <div class="join-row">
          <input id="room-code-input" class="room-input" type="text" placeholder="Room code" />
          <button id="join-room-btn" class="btn btn-primary" type="button">Join</button>
        </div>
        <p class="room-meta" id="room-meta">No room connected.</p>
      </div>

      <div class="buttons">
        <button id="undo-btn" class="btn btn-muted" type="button">Undo</button>
        <button id="reset-btn" class="btn btn-primary" type="button">New Game</button>
      </div>
      <h2 class="moves-title">Moves</h2>
      <div class="moves-wrap">
        <table class="moves-table" aria-label="Move list">
          <thead>
            <tr>
              <th>#</th>
              <th>White</th>
              <th>Black</th>
            </tr>
          </thead>
          <tbody id="moves-body"></tbody>
        </table>
      </div>
    </aside>
  </main>

  <div class="modal-backdrop" id="modal-backdrop" hidden></div>

  <section class="modal" id="mode-modal" role="dialog" aria-modal="true" hidden>
    <h3>Choose Mode</h3>
    <p>Pick how you want to play now.</p>
    <div class="buttons">
      <button id="modal-single-btn" class="btn btn-primary" type="button">Single Player</button>
      <button id="modal-multi-btn" class="btn btn-muted" type="button">Multiplayer</button>
    </div>
  </section>

  <section class="modal" id="room-modal" role="dialog" aria-modal="true" hidden>
    <h3 id="room-modal-title">Room</h3>
    <p id="room-modal-text">Room details</p>
    <div class="buttons">
      <button id="room-modal-copy-btn" class="btn btn-primary" type="button">Copy Code</button>
      <button id="room-modal-close-btn" class="btn btn-muted" type="button">Close</button>
    </div>
  </section>

  <section class="modal" id="result-modal" role="dialog" aria-modal="true" hidden>
    <h3>Game Over</h3>
    <p id="result-modal-text">Result</p>
    <div class="buttons">
      <button id="result-new-game-btn" class="btn btn-primary" type="button">Play Again</button>
      <button id="result-close-btn" class="btn btn-muted" type="button">Close</button>
    </div>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
